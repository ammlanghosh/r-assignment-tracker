<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Assessment Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Assessment Tracker</h1>

        <div class="stats">
            <div class="card">
                <h2 id="totalStudents">0</h2>
                <p>Total Students</p>
            </div>

            <div class="card">
                <h2 id="completedStudents">0</h2>
                <p>Completed</p>
            </div>

            <div class="card">
                <h2 id="pendingStudents">0</h2>
                <p>Pending</p>
            </div>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by Register Number or Student Name"
            >
        </div>

        <table>
            <thead>
                <tr>
                    <th>RegNo</th>
                    <th>Student Name</th>
                    <th>GitHub Link</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
                <tr>
                    <td colspan="3">Loading students...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your JavaScript -->
    <script src="app.js"></script>

</body>
</html>
